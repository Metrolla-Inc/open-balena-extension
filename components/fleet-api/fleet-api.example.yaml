# /etc/fleet-api/fleet-api.yaml — copy and adjust. ${DNS_TLD} is expanded from the environment.
# Secrets are never in this file: each *_file below names a file under /run/secrets.
balena:
  api_url: https://api.${DNS_TLD}
  api_key_file: /run/secrets/balena_api_key     # balena api-key generate fleet-api
  verify: /certs/root-ca.pem                     # or false while proving the path on a lab host
builder:
  mode: http                                     # http (what balena push does) | cli (balena push)
  url: http://builder:80
git:
  repo_base: https://github.com/Metrolla-Inc/
  allowed_repos: [balena-fleets, balena-fleets-metrollaprod]
  token_file: /run/secrets/git_token             # read-only token for those repos
reach:
  mode: vpn_proxy                                # vpn_proxy | connectivity
  proxy_host: vpn
  proxy_port: 3128
  device_port: 80
  device_token_file: /run/secrets/device_token   # only when device EdgeAPI sign-in is on
  device_user: fleet-api
imagemaker:
  url: http://host.docker.internal:8090
  token_file: /run/secrets/imagemaker_token
server:
  containers:
    builder_dind: open-balena-builder-dind-1
    haproxy: open-balena-haproxy-1
    registry: open-balena-registry-1
rollout:
  update_timeout_min: 30
  verify_settle_s: 60
webhooks: []
#  - url: https://servicenow.example/api/fleet-hook
#    events: ["fleet.change.*"]
#    secret_file: /run/secrets/webhook_servicenow
change_control:
