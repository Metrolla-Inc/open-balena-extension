name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint (shell · node · secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint (bash -n, node --check, shellcheck, secret-scan)
        run: make lint

  ansible:
    name: ansible syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core
          ansible-galaxy collection install community.docker
      - name: Syntax-check the playbook
        working-directory: ansible
        run: ansible-playbook --syntax-check -i inventory.example.ini site.yml

  fleet-api:
    name: fleet-api tests
    runs-on: ubuntu-latest
    env:
      # metrolla-auth lives in the private EdgeAPI repo; without a read token the job is skipped.
      EDGEAPI_READ_TOKEN: ${{ secrets.EDGEAPI_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skip without EdgeAPI access
        if: env.EDGEAPI_READ_TOKEN == ''
        run: echo "::warning::EDGEAPI_READ_TOKEN is not set, so metrolla-auth can't be installed; fleet-api tests skipped"
      - name: Install
        if: env.EDGEAPI_READ_TOKEN != ''
        working-directory: components/fleet-api
        run: |
          git config --global url."https://x-access-token:${EDGEAPI_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          pip install -r requirements.txt -r requirements-auth.txt -r requirements-test.txt
      - name: pytest
        if: env.EDGEAPI_READ_TOKEN != ''
        working-directory: components/fleet-api
        run: python -m pytest -q
